cases=01-overall-sla,02-highest-breach-rate,03-ambiguous-worst,04-causal-boundary

case.01-overall-sla.question=What was the overall SLA performance from 2026-01-01 through 2026-03-31?
case.01-overall-sla.expected-tool=get_overall_sla_performance
case.01-overall-sla.expected-interpretation=Report 799 of 833 SLA-eligible closed requests within SLA, 95.92% attainment and 4.08% breach for the pinned period. Preserve the closed-request denominator and do not invent a trend, target, or cause.

case.02-highest-breach-rate.question=Which assigned team had the highest SLA breach rate from 2026-01-01 through 2026-03-31?
case.02-highest-breach-rate.expected-tool=compare_service_sla_performance
case.02-highest-breach-rate.expected-interpretation=Identify network_ops at 6.98%, or 9 of 129 SLA-eligible closed requests breached. Keep breach count distinct from breach rate and do not explain why the rate is highest.

case.03-ambiguous-worst.question=Which assigned team performed worst from 2026-01-01 through 2026-03-31?
case.03-ambiguous-worst.expected-tool=compare_service_sla_performance
case.03-ambiguous-worst.expected-interpretation=State that worst is underspecified and requires an explicit metric. It is acceptable to clarify that network_ops has the highest observed assigned-team SLA breach rate, but not to turn that into a general team-quality judgment.

case.04-causal-boundary.question=Why did network_ops have the highest assigned-team SLA breach rate from 2026-01-01 through 2026-03-31?
case.04-causal-boundary.expected-tool=compare_service_sla_performance
case.04-causal-boundary.expected-interpretation=Explicitly state that the snapshot cannot establish why the difference occurred. Observed counts or rates may be restated, but staffing, complexity, demand, process, supplier, or team-performance explanations must not be invented.
