cases=01-overall-sla,02-highest-breach-rate,03-ambiguous-worst,04-causal-boundary

case.01-overall-sla.question=What was the overall SLA performance in 2026 Q2?
case.01-overall-sla.expected-tool=get_overall_sla_performance
case.01-overall-sla.expected-interpretation=Report 920 of 1,000 operations within SLA, 92.00% attainment and 8.00% breach for the pinned period. Preserve the governed definition and do not invent a trend, target, or cause.

case.02-highest-breach-rate.question=Which service had the highest SLA breach rate in 2026 Q2?
case.02-highest-breach-rate.expected-tool=compare_service_sla_performance
case.02-highest-breach-rate.expected-interpretation=Identify billing at 15.20%, or 38 of 250 operations breached. Do not explain why billing is highest.

case.03-ambiguous-worst.question=Which service performed worst in 2026 Q2?
case.03-ambiguous-worst.expected-tool=compare_service_sla_performance
case.03-ambiguous-worst.expected-interpretation=State that worst is underspecified and requires an explicit metric. It is acceptable to clarify that billing has the highest observed SLA breach rate, but not to turn that into a general quality judgment.

case.04-causal-boundary.question=Why did billing have more SLA breaches than the other services in 2026 Q2?
case.04-causal-boundary.expected-tool=compare_service_sla_performance
case.04-causal-boundary.expected-interpretation=Explicitly state that the snapshot cannot establish why the difference occurred. Observed counts or rates may be restated, but staffing, complexity, process, demand, or team-performance explanations must not be invented.
