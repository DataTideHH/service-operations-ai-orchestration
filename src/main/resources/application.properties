# V1 remains runnable without credentials. V2/V3 model evaluation explicitly selects a provider.
spring.ai.model.chat=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
app.evaluation.enabled=false
app.evaluation.provider=none
app.evaluation.model=unspecified
app.evaluation.output-directory=evidence/runs
app.evaluation.application-version=0.4.0
app.evaluation.source-revision=local
app.evaluation.artifact-command=none
app.evaluation.offline-run-at=now
app.evaluation.artifact-report=evidence/runs/evaluation-report.json
app.evaluation.artifact-baseline=evidence/runs/evaluation-baseline.json
