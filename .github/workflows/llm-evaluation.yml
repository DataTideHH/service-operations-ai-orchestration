name: manual-llm-evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Spring AI chat provider
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic
      model:
        description: Exact provider model name
        required: true
        default: gpt-5-mini
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      SPRING_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPRING_AI_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APP_EVALUATION_PROVIDER: ${{ inputs.provider }}
      APP_EVALUATION_MODEL: ${{ inputs.model }}
      APP_EVALUATION_OUTPUT_DIRECTORY: evidence/runs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build deterministic V1/V2 checks
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Run model-dependent evaluation
        id: evaluation
        continue-on-error: true
        shell: bash
        run: |
          JAR_PATH=$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)
          if [ "${{ inputs.provider }}" = "openai" ]; then
            java -jar "$JAR_PATH" \
              --app.evaluation.enabled=true \
              --spring.ai.model.chat=openai \
              --spring.ai.openai.chat.options.model="${{ inputs.model }}"
          else
            java -jar "$JAR_PATH" \
              --app.evaluation.enabled=true \
              --spring.ai.model.chat=anthropic \
              --spring.ai.anthropic.chat.options.model="${{ inputs.model }}"
          fi
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evaluation-${{ inputs.provider }}-${{ inputs.model }}
          path: evidence/runs/evaluation-report.md
          if-no-files-found: error
      - name: Enforce evaluation outcome
        if: steps.evaluation.outcome != 'success'
        run: exit 1
