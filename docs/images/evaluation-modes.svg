<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 556" width="1000" height="556" role="img" aria-labelledby="t2 d2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t2">Credential-free pipeline check and the prepared live-provider evaluation</title>
  <desc id="d2">Two evaluation lanes share the same governed reporting pipeline. The implemented left lane runs four governed cases through two real Java tools, uses authored reference answers and deterministic reference checks, and involves no model, so it does not measure model or prompt quality. The right lane, drawn with a dashed outline because it is prepared but not yet executed, runs the same four cases through an LLM client with the same two tools, captures the observed answer and tool trace, and assesses it with a separate judge client that has no tools. Both lanes produce a versioned run manifest, Markdown and JSON reports, schema validation and baseline comparison. Offline evidence establishes pipeline integrity; live evidence would establish model behaviour and is still pending.</desc>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7a8b99"/>
    </marker>
  </defs>

  <!-- dashed container: prepared lane -->
  <rect x="504" y="10" width="482" height="362" rx="12" fill="none" stroke="#7a8b99" stroke-width="2" stroke-dasharray="9 6"/>

  <!-- ============ lane headers ============ -->
  <rect x="20" y="16" width="470" height="40" rx="8" fill="#0b92b6"/>
  <text x="255" y="41" text-anchor="middle" fill="#ffffff" font-size="15">Credential-free pipeline check — implemented</text>

  <rect x="516" y="16" width="458" height="40" rx="8" fill="#5c6b78"/>
  <text x="745" y="41" text-anchor="middle" fill="#ffffff" font-size="15">Live-provider evaluation — prepared, not yet executed</text>

  <!-- ============ lane A steps ============ -->
  <g fill="#0b2e4f">
    <rect x="20" y="68" width="470" height="54" rx="8"/>
    <rect x="20" y="132" width="470" height="54" rx="8"/>
    <rect x="20" y="196" width="470" height="54" rx="8"/>
    <rect x="20" y="260" width="470" height="54" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="15">
    <text x="255" y="100">Four governed cases</text>
    <text x="255" y="164">Two real Java tools</text>
    <text x="255" y="228">Authored reference answers</text>
    <text x="255" y="292">Deterministic reference checks</text>
  </g>

  <!-- ============ lane B steps ============ -->
  <g fill="#5c6b78">
    <rect x="516" y="68" width="458" height="54" rx="8"/>
    <rect x="516" y="132" width="458" height="54" rx="8"/>
    <rect x="516" y="196" width="458" height="54" rx="8"/>
    <rect x="516" y="260" width="458" height="54" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#ffffff" font-size="15">
    <text x="745" y="100">Four governed cases</text>
    <text x="745" y="164">LLM client — same two tools</text>
    <text x="745" y="228">Observed answer and tool trace</text>
    <text x="745" y="292">Separate judge client, no tools</text>
  </g>

  <!-- ============ vertical arrows ============ -->
  <g stroke="#7a8b99" stroke-width="2" marker-end="url(#ar2)">
    <line x1="255" y1="124" x2="255" y2="128"/>
    <line x1="255" y1="188" x2="255" y2="192"/>
    <line x1="255" y1="252" x2="255" y2="256"/>
    <line x1="745" y1="124" x2="745" y2="128"/>
    <line x1="745" y1="188" x2="745" y2="192"/>
    <line x1="745" y1="252" x2="745" y2="256"/>
  </g>

  <!-- ============ lane notes ============ -->
  <rect x="20" y="326" width="470" height="34" rx="8" fill="#40566b"/>
  <text x="255" y="348" text-anchor="middle" fill="#ffffff" font-size="13.5">No model involved — measures the pipeline, not model quality</text>

  <rect x="516" y="326" width="458" height="34" rx="8" fill="#40566b"/>
  <text x="745" y="348" text-anchor="middle" fill="#ffffff" font-size="13.5">Awaiting a live provider run</text>

  <!-- ============ convergence ============ -->
  <g stroke="#7a8b99" stroke-width="2.5" fill="none" marker-end="url(#ar2)">
    <path d="M255,364 L255,396"/>
    <path d="M745,376 L745,396"/>
  </g>

  <rect x="20" y="400" width="954" height="56" rx="8" fill="#40566b"/>
  <text x="497" y="424" text-anchor="middle" fill="#ffffff" font-size="14.5">Versioned run manifest · Markdown and JSON reports</text>
  <text x="497" y="444" text-anchor="middle" fill="#e4ecf2" font-size="14">deterministic validation · compatible-baseline comparison</text>

  <g stroke="#7a8b99" stroke-width="2.5" marker-end="url(#ar2)">
    <line x1="255" y1="458" x2="255" y2="482"/>
    <line x1="745" y1="458" x2="745" y2="482"/>
  </g>

  <!-- ============ outcomes ============ -->
  <rect x="20" y="486" width="470" height="46" rx="8" fill="#0b92b6"/>
  <text x="255" y="514" text-anchor="middle" fill="#ffffff" font-size="15">Offline evidence → pipeline integrity</text>

  <rect x="516" y="486" width="458" height="46" rx="8" fill="#5c6b78"/>
  <text x="745" y="514" text-anchor="middle" fill="#ffffff" font-size="15">Live evidence → model behaviour (pending)</text>
</svg>
